# Use the repository root so the backend can compile ../shared and install workspaces.
services:
  - type: web
    name: leadcrm-backend
    runtime: node
    buildCommand: npx --yes npm@11.19.1 ci --include=dev && npm --prefix backend run build
    # Apply committed migrations before accepting requests. Account seeding remains
    # in the existing server bootstrap; do not invoke a second seeder here.
    startCommand: npm --prefix backend run db:deploy && npm --prefix backend start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SKIP_DEMO_TENANTS
        value: "true"
    # Configure DATABASE_URL, DIRECT_URL, JWT_SECRET, APP_URL, ALLOWED_ORIGINS,
    # GMAIL_CLIENT_ID, BREVO_API_KEY and BREVO_FROM_EMAIL
    # in Render's dashboard. See docs/setup/deployment.md.
